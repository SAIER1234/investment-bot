name: 探测 yfinance 数据管道

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install yfinance pandas

      - name: 创建 data 目录
        run: mkdir -p data

      - name: 运行探测脚本
        run: python src/test_yfinance_pipe.py

      - name: 上传探测结果
        uses: actions/upload-artifact@v4
        with:
          name: yfinance-probe-result
          path: data/yfinance_probe_result.json
